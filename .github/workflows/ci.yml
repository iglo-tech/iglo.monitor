name: CI

on:
    push:
        branches:
            - main
    pull_request:

env:
    BUN_VERSION: "1.4.0"

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Build frontend
              run: bun run build:frontend

            - name: Backend tests
              run: bun run test:backend

            - name: Install Playwright Chromium
              run: bunx playwright install --with-deps chromium

            - name: End-to-end tests
              run: bun run test-e2e

            - name: Compile linux x64 binary
              run: |
                  bun scripts/build/build-binary.ts \
                    --target=bun-linux-x64 \
                    --outfile=dist/releases/iglo.monitor-linux-x64
                  test -f dist/releases/iglo.monitor-linux-x64
                  ls -lh dist/releases/iglo.monitor-linux-x64

            - name: Test compiled SMTP provider loading
              run: IGLO_MONITOR_BINARY=dist/releases/iglo.monitor-linux-x64 bun run test:notification-provider-binary

            - name: Test compiled auth, API keys, and metrics
              run: IGLO_MONITOR_BINARY=dist/releases/iglo.monitor-linux-x64 bun run test:auth-security-binary
